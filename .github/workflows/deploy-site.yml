name: Deploy site

# Publishes the website and the latest signed appcast to Workers Static Assets.
# Release workflows also deploy their signed appcast with the matching site.

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-site.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "Resources/Marketing/app-icon.png"
      - "Tools/**"
      - "Localization/**"
      - "docs/**"
      - "DemoLab/publication.json"
      - "DemoLab/Localization/**"
      - "DemoLab/scenes/**"
      - ".github/workflows/deploy-site.yml"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.release.outputs.should-build }}
      version: ${{ steps.release.outputs.version }}
      release-version: ${{ steps.release.outputs.release-version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve site version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^let appVersion = "([^"]+)"/\1/p' Project.swift)"
          RELEASE_VERSION="$(gh release view --repo "$REPO" --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || true)"
          echo "release-version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RELEASE_VERSION" ] || [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping site: app version ${APP_VERSION:-<unknown>} is ahead of latest release ${RELEASE_VERSION:-<none>}"
            exit 0
          fi
          echo "should-build=true" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install HTTP client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends curl

      - name: Assemble site
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"

          # Latest release version for the no-JS download/version fallback in
          # index.html (the page also resolves this live via the API).
          echo "Latest version: $VERSION"

          swift test --package-path Tools
          swift run --package-path Tools tatami-tools build-site --output "$SITE" --version "$VERSION"

      - name: Download signed release appcast
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.release-version }}
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          # Every deployment must include the latest signed release feed.
          # Fail if it is unavailable instead of publishing a stale or missing feed.
          curl --fail --location --show-error \
            "https://github.com/$REPO/releases/download/v$VERSION/appcast.xml" \
            --output "$SITE/appcast.xml"
          echo "appcast.xml: $(wc -c < "$SITE/appcast.xml") bytes"

      - name: Add static asset headers
        run: cp web/_headers "$RUNNER_TEMP/site/_headers"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://tatami.pangmo5.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Deploy static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.131.2"
          command: deploy
